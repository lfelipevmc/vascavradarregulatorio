services:
  # ── API (FastAPI + APScheduler embutido) ─────────────────────────────────────
  - type: web
    name: radar-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: radar-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: radar-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: '["https://radar-frontend.onrender.com","http://localhost:3000"]'
      - key: ENABLE_SCHEDULER
        value: "true"

  # ── Frontend (Next.js) ────────────────────────────────────────────────────────
  - type: web
    name: radar-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://radar-api.onrender.com

  # ── Redis ─────────────────────────────────────────────────────────────────────
  - type: redis
    name: radar-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  - name: radar-db
    plan: free
    databaseName: radar_regulatorio
    user: radar
